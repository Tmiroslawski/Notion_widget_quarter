
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- WSTAW SWÓJ IDENTYFIKATOR ADOBE FONTS -->
  <link rel="stylesheet" href="https://use.typekit.net/rcl8fkm.css">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 8px;
      background: transparent;
      color: #222222;
    }

    .widget {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      font-family: "paralucent", sans-serif;
    }

    .quarter {
      font-family: "paralucent", sans-serif;
      font-size: 80pt;
      font-weight: 800;
      font-style: normal;
      line-height: 0.95;
      letter-spacing: -0.035em;
      margin: 0;
      padding: 0;
    }

    .month {
      font-family: "paralucent", sans-serif;
      font-size: 20pt;
      font-weight: 200;
      font-style: normal;
      line-height: 1.2;
      margin: 4px 0 0 2px;
      padding: 0;
    }
  </style>
</head>

<body>
  <main class="widget">
    <div class="quarter" id="quarter">Q 1</div>
    <div class="month" id="month">Styczeń</div>
  </main>

  <script>
    const months = [
      "Sty",
      "Lut",
      "Mar",
      "Kwi",
      "Maj",
      "Cze",
      "Lip",
      "Sie",
      "Wrz",
      "Paz",
      "Lis",
      "Gru"
    ];

    function updateDate() {
      const now = new Date();
      const monthIndex = now.getMonth();
      const quarter = Math.floor(monthIndex / 3) + 1;

      document.getElementById("quarter").textContent =
        `Q ${quarter}`;

      document.getElementById("month").textContent =
        months[monthIndex];
    }

    updateDate();

    // Aktualizacja również po zmianie daty podczas
    // pozostawienia strony otwartej.
    setInterval(updateDate, 60000);
  </script>
</body>
</html>
