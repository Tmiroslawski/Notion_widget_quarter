
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: transparent;
      color: #222222;
    }

    .widget {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .quarter {
      font-size: 50px;
      font-weight: 900;
      line-height: 1.2;
    }

    .month {
      font-size: 20px;
      font-weight: 400;
      line-height: 1.4;
    }
  </style>
</head>

<body>
  <div class="widget">
    <div class="quarter" id="quarter">Q 1</div>
    <div class="month" id="month">Styczeń</div>
  </div>

  <script>
    const now = new Date();

    // Odczyt aktualnego miesiąca: 0 = styczeń
    const monthIndex = now.getMonth();

    // Obliczenie kwartału
    const quarter = Math.floor(monthIndex / 3) + 1;

    // Nazwy miesięcy po polsku
    const months = [
      "Styczeń",
      "Luty",
      "Marzec",
      "Kwiecień",
      "Maj",
      "Czerwiec",
      "Lipiec",
      "Sierpień",
      "Wrzesień",
      "Październik",
      "Listopad",
      "Grudzień"
    ];

    // Wyświetlenie wyników
    document.getElementById("quarter").textContent =
      `Q ${quarter}`;

    document.getElementById("month").textContent =
      months[monthIndex];
  </script>
</body>
</html>
